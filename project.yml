name: SiriTrace
options:
  deploymentTarget:
    macOS: "27.0"
  bundleIdPrefix: com.siritrace
  xcodeVersion: "2700"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SiriTrace:
    type: application
    platform: macOS
    sources:
      - path: SiriTrace
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siritrace.app
        INFOPLIST_FILE: SiriTrace/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SiriTrace/SiriTrace.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: SiriTrace
        COMBINE_HIDPI_IMAGES: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
    dependencies:
      - sdk: IOKit.framework
